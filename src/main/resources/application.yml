server:
  port: 8082


base-url:
  context: /axonect/aee/templates/v1.0/base-template
  app:
    host: /MICROSERVICE_NAME/
    default:
      group-id: 1

    encryption:
      algorithm: "${ENCRYPTION_TYPE}"
      secret-key: "${ENCRYPTION_SECRET_KEY}"
    async:
      core-pool-size: 50
      max-pool-size: 200
      queue-capacity: 10000
      thread-name-prefix: "async-validation-"

log:
  identifierKey: UUID
  isDebug: true
info:
  app:
    name :  base-template
    msName : base-template
com:
  adl:
    dte:
      plugins:
        logging:
          enabled: true
          level: DEBUG
        rolling:
          policy: size
          size: 100000kb
        alarming:
          enabled: true
        msstat:
          enabled: true

springdoc:
  packagesToScan: com.axonect.aee.template.baseapp.application.controller
  pathsToMatch: /**
  swagger-ui:
    configUrl: /MICROSERVICE_NAME/v3/api-docs/swagger-config
    url: /MICROSERVICE_NAME/v3/api-docs
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs


spring:
  data:
    redis:
      sentinel:
        master: "${REDIS_MASTER_NAME}"
        nodes: redis-cluster.cluster-redis.svc.cluster.local:26379
      password: "${REDIS_PASSWORD}"
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 300
          max-idle: 50
          min-idle: 10
          max-wait: 800ms
  datasource:
    #    url: jdbc:oracle:thin:@aaa-dev.cn8eyeqma3tp.ap-southeast-2.rds.amazonaws.com:1521/ORCL
    #    username: aaa
    #    password: Aaa!89nky78D
        url: jdbc:oracle:thin:@localhost:1521/XEPDB1
        username: "${DB_USER}"
        password: "${DB_PASSWORD}"
        driver-class-name: oracle.jdbc.OracleDriver

        hikari:
          maximum-pool-size: 50
          minimum-idle: 30
          connection-timeout: 10000
          idle-timeout: 3000
          max-lifetime: 180000
          pool-name: AAAHikariPool
          leak-detection-threshold: 60000

          data-source-properties:
            oracle.net.CONNECT_TIMEOUT: 10000
            oracle.jdbc.ReadTimeout: 30000

        jpa:
          hibernate:
            ddl-auto: update
          show-sql: true
          properties:
            hibernate:
              format_sql: true
              dialect: org.hibernate.dialect.OracleDialect
              jdbc:
                batch_size: 20
                fetch_size: 1000
              order_inserts: true
              order_updates: true
              connection:
                pool_size: 200

  kafka:
    bootstrap-servers:
      dc: kafka-headless.cluster-dc.svc.cluster.local:9092
      dr: kafka-headless.cluster-dc.svc.cluster.local:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        max.in.flight.requests.per.connection: 5
        compression.type: lz4
        batch.size: 32768
        linger.ms: 5
        buffer.memory: 67108864
        delivery.timeout.ms: 8000
        request.timeout.ms: 5000
        max.block.ms: 5000

    consumer:
      group-id: spring-reply-group-reports   # UNIQUE
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: true
      properties:
        fetch.min.bytes: 1
        fetch.max.wait.ms: 500
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000


kafka:
  reply:
    topic: db-write-events-reply-reports
  publishing:
    topic: dc-provisioning
  group:
    id: spring-reply-group-reports   # UNIQUE



app:
  host: APP_BASE_PATH_PLACEHOLDER

logging:
  level:
    org.springframework.web: INFO

message-log:
  base-url: https://localhost:8089/api/logs/action-logs

session-history:
  base-url: http://localhost:9907/api/aaa/admin-console/connection-history/summary/filter

product-details:
  base-url: http://aeb53274042be477aba79f9076056316-ee9e05124271e8a5.elb.ap-southeast-2.amazonaws.com/airtel-aaa-product-catalog-management/api/plans/filter

subscriber-details:
  base-url: https://localhost:8089/api/user

audit-log:
  base-url: https://localhost:8089/api/user

csv:
  output:
    directory:  /reports/output

report:
  default:
    offset: 0
    limit: 5
  batch:
    size: 200
  output:
     directory: /reports/output
  watchdog:
    stale-threshold-minutes: 20
    check-interval-ms: 1200000   # 20 * 60 * 1000
  user-dump:
    # Users per database page and per Elasticsearch aggregation request. This is what bounds
    # heap: only one page of rows is live at a time, so the dump costs the same whether it is
    # three thousand rows or three million. Well under Elasticsearch's default
    # index.max_terms_count (65536), which caps the terms filter used for the page's users.
    chunk-size: 5000
    # Oracle row prefetch. Rows come back in blocks of this size instead of one round trip each.
    jdbc-fetch-size: 2000
    # Output buffer for the CSV stream; a megabyte turns millions of rows into a few thousand writes.
    csv-buffer-bytes: 1048576
    # One unambiguous timestamp format across every date column in the dump.
    timestamp-format: "yyyy-MM-dd HH:mm:ss"
    # What a bucket provisioned as unlimited reports in the QUOTA column.
    unlimited-quota-label: Unlimited
    # Zone D-1 is resolved in. Must match cdr-service's app.timezone, which decides the date
    # suffix of the session index this report reads usage from.
    timezone: "${TZ:UTC}"
    elk:
      # Base name of cdr-service's daily session indices (sessions-data in its configuration).
      index-prefix: radius-sessions
      # Composite aggregation page size; each page is one round trip.
      composite-page-size: 5000

# Elasticsearch cluster cdr-service writes the radius-sessions-* indices to, read here to total
# each user's session usage for the dump.
elasticsearch:
  host: elasticsearch.efk.svc.cluster.local
  port: 9200
  protocol: http
  username: "${ES_USER:}"
  password: "${ES_PASSWORD:}"
  pool:
    max-conn-total: 50
    max-conn-per-route: 50
    io-thread-count: 2
    connect-timeout-ms: 5000
    # A composite aggregation page over a full day of sessions is far heavier than a document read.
    socket-timeout-ms: 120000
    connection-request-timeout-ms: 5000

redis:
  client-type: sentinel
  hosts: redis://redis-cluster.cluster-redis.svc.cluster.local:26379
  master-name: "${REDIS_MASTER_NAME}"
  role: "${REDIS_ROLE}"
  password: "${REDIS_PASSWORD}"
  max-pool-size: 300
  max-waiting-handlers: 5000
  max-pool-waiting: 800
  pool-recycle-timeout: 240000
  reconnect-attempts: 3
  reconnect-interval: 500
  pool-cleaner-interval: 20000
  timeout: 60000

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
      path-mapping:
        prometheus: prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

