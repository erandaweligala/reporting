server:
  port: 8082


base-url:
  context: /axonect/aee/templates/v1.0/base-template
  app:
    host: /MICROSERVICE_NAME/
    default:
      group-id: 1

    encryption:
      algorithm: "${ENCRYPTION_TYPE}"
      secret-key: "${ENCRYPTION_SECRET_KEY}"
    async:
      core-pool-size: 50
      max-pool-size: 200
      queue-capacity: 10000
      thread-name-prefix: "async-validation-"

log:
  identifierKey: UUID
  isDebug: true
info:
  app:
    name :  base-template
    msName : base-template
com:
  adl:
    dte:
      plugins:
        logging:
          enabled: true
          level: DEBUG
        rolling:
          policy: size
          size: 100000kb
        alarming:
          enabled: true
        msstat:
          enabled: true

springdoc:
  packagesToScan: com.axonect.aee.template.baseapp.application.controller
  pathsToMatch: /**
  swagger-ui:
    configUrl: /MICROSERVICE_NAME/v3/api-docs/swagger-config
    url: /MICROSERVICE_NAME/v3/api-docs
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs


spring:
  data:
    redis:
      sentinel:
        master: "${REDIS_MASTER_NAME}"
        nodes: redis-cluster.cluster-redis.svc.cluster.local:26379
      password: "${REDIS_PASSWORD}"
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 300
          max-idle: 50
          min-idle: 10
          max-wait: 800ms
  datasource:
    #    url: jdbc:oracle:thin:@aaa-dev.cn8eyeqma3tp.ap-southeast-2.rds.amazonaws.com:1521/ORCL
    #    username: aaa
    #    password: Aaa!89nky78D
        url: jdbc:oracle:thin:@localhost:1521/XEPDB1
        username: "${DB_USER}"
        password: "${DB_PASSWORD}"
        driver-class-name: oracle.jdbc.OracleDriver

        hikari:
          maximum-pool-size: 50
          minimum-idle: 30
          connection-timeout: 10000
          idle-timeout: 3000
          max-lifetime: 180000
          pool-name: AAAHikariPool
          leak-detection-threshold: 60000

          data-source-properties:
            oracle.net.CONNECT_TIMEOUT: 10000
            oracle.jdbc.ReadTimeout: 30000

        jpa:
          hibernate:
            ddl-auto: update
          show-sql: true
          properties:
            hibernate:
              format_sql: true
              dialect: org.hibernate.dialect.OracleDialect
              jdbc:
                batch_size: 20
                fetch_size: 1000
              order_inserts: true
              order_updates: true
              connection:
                pool_size: 200

  kafka:
    bootstrap-servers:
      dc: kafka-headless.cluster-dc.svc.cluster.local:9092
      dr: kafka-headless.cluster-dc.svc.cluster.local:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        max.in.flight.requests.per.connection: 5
        compression.type: lz4
        batch.size: 32768
        linger.ms: 5
        buffer.memory: 67108864
        delivery.timeout.ms: 8000
        request.timeout.ms: 5000
        max.block.ms: 5000

    consumer:
      group-id: spring-reply-group-reports   # UNIQUE
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: true
      properties:
        fetch.min.bytes: 1
        fetch.max.wait.ms: 500
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000


kafka:
  reply:
    topic: db-write-events-reply-reports
  publishing:
    topic: dc-provisioning
  group:
    id: spring-reply-group-reports   # UNIQUE



app:
  host: APP_BASE_PATH_PLACEHOLDER

logging:
  level:
    org.springframework.web: INFO

message-log:
  base-url: https://localhost:8089/api/logs/action-logs

session-history:
  base-url: http://localhost:9907/api/aaa/admin-console/connection-history/summary/filter

product-details:
  base-url: http://aeb53274042be477aba79f9076056316-ee9e05124271e8a5.elb.ap-southeast-2.amazonaws.com/airtel-aaa-product-catalog-management/api/plans/filter

subscriber-details:
  base-url: https://localhost:8089/api/user

audit-log:
  base-url: https://localhost:8089/api/user

csv:
  output:
    directory:  /reports/output

report:
  default:
    offset: 0
    limit: 5
  batch:
    size: 200
  output:
     directory: /reports/output
  watchdog:
    stale-threshold-minutes: 20
    check-interval-ms: 1200000   # 20 * 60 * 1000

  # MAC_SERVICE_TABLE, PLAN_TO_BUCKET and BUCKET_INSTANCE: whole-table extracts, as CSV.
  # One cursor and one sequential pass per extract; the knobs below are what bound its footprint.
  table-extract:
    jdbc-fetch-size: 5000        # rows Oracle ships per round trip
    query-timeout-seconds: 7200  # an extract that has gone wrong is cancelled, not left running
    csv-buffer-bytes: 1048576    # 1 MB in front of the output file
    # Oracle format model for every date column. The samples carried milliseconds; the operator
    # who opens an extract reads yyyy-MM-dd HH:mm:ss, and excel-safe-timestamps below normalises a
    # fraction away in any case, so the model no longer asks for one.
    date-format: "YYYY-MM-DD HH24:MI:SS"
    # Write the date columns as ="2026-08-18 14:31:23" rather than as bare text. Excel does not
    # read a CSV timestamp as a timestamp — it converts the text to the day number behind it and
    # shows that number (46271.07939), which is what the date columns of all three extracts were
    # reading. The ="..." form is a formula whose value is the string, so it is displayed exactly
    # as written. Set false for a consumer that loads an extract with something other than a
    # spreadsheet and wants the database's own text.
    excel-safe-timestamps: true
    # BUCKET_INSTANCE.USAGE: the total the CDR session documents record against each bucket — the
    # figure USER_DATA_DUMP reports as UTLIZED_QUOTA — rather than the table's own USAGE column.
    # The lookup itself is configured once, under report.user-dump.usage below: same indices, same
    # bundle scope, one definition of what the figure is. Reading it costs this extract a join to
    # SERVICE_INSTANCE for the username the CDRs are keyed on, an ORDER BY on it, and one
    # Elasticsearch aggregation walked in step with the scan. Set false to report the column as
    # the table holds it; a run falls back to that by itself when report.user-dump.usage.enabled
    # is off — there are then no CDR figures for either report — and the startup log says which of
    # the two figures a deployment is reporting. A sessionInstances mapping that is not nested no
    # longer takes the column away: there is then no per-bucket split for either report to read, so
    # each subscriber's whole CDR total, which is what UTLIZED_QUOTA reports for them, is reported
    # here against their quota bucket and their other buckets report 0.
    usage-from-cdr: true

  # USER_DATA_DUMP: the full subscriber base (~3M rows) for the previous day, as CSV.
  user-dump:
    days-back: 1                 # 1 = D-1
    timezone: "${TZ:UTC}"        # must match the zone the CDR daily indices are named in
    shards: 4                    # username ranges scanned in parallel; 1 disables sharding
    worker-threads: 0            # 0 = one thread per shard
    jdbc-fetch-size: 5000        # rows Oracle ships per round trip
    query-timeout-seconds: 7200
    csv-buffer-bytes: 1048576    # 1 MB in front of the output file
    # Oracle format model for every timestamp column.
    date-format: "YYYY-MM-DD HH24:MI:SS"
    # Write the timestamp columns as ="2026-09-06 01:54:19" rather than as bare text. Excel does
    # not read a CSV timestamp as a timestamp — it converts the text to the day number behind it
    # and shows that number (46271.07939), which is what the date columns of the dump were
    # reading. The ="..." form is a formula whose value is the string, so it is displayed exactly
    # as written; the text is normalised to yyyy-MM-dd HH:mm:ss whatever date-format above says.
    # Set false for a consumer that reads the dump with something other than a spreadsheet.
    excel-safe-timestamps: true
    # BUCKET_INSTANCE.BUCKET_TYPE whose RULE is PLAN_BANDWIDTH. Matched on normalised text, so a
    # column reading 'Bandwidth' meets it; a bundle holding no bucket of this type reports the RULE
    # its own buckets do carry, which is what a deployment keeping one bucket per bundle has. Leave
    # it empty for "whichever bucket holds the rule".
    bandwidth-bucket-type: BANDWIDTH
    # BUCKET_INSTANCE.BUCKET_TYPE holding QUOTA, matched the same way. There is no fallback here:
    # another bucket's INITIAL_BALANCE is not this bundle's allowance, so a type that names no
    # bucket leaves QUOTA empty and UTLIZED_QUOTA the subscriber's total across buckets.
    quota-bucket-type: DATA
    usage:
      enabled: true
      index: radius-sessions     # cdr-service `sessions-data`; the daily indices are derived from it
      page-size: 2000            # usernames per composite aggregation page
      # Days of CDR indices UTLIZED_QUOTA is summed over, ending today. 0 is every index the
      # cluster still holds, which is what a total means: the column is read next to QUOTA, the
      # bucket's whole allowance, so it has to be everything the bundle has drawn from that bucket
      # rather than the slice of it that fell on D-1. Today's index is read along with the rest —
      # striking the days after the reported one out of the wildcard, which is what kept a dump
      # off the index cdr-service writes into, left a bundle taken out this morning with an empty
      # UTLIZED_QUOTA rather than with its usage. A positive value names that many daily indices
      # instead, the last of them today's.
      lookback-days: 0
      buckets-per-user: 20
      # The CDR names the service instance each usage delta was drawn against, and a bucket id
      # names the plan's bucket rather than one instance of it — so without this scope a recurring
      # subscriber's every past cycle would be reported against the current cycle's QUOTA. Set it
      # false to report the bucket's total across every bundle that drew on it; the dump logs per
      # shard how many rows already had to fall back to that.
      scope-to-service: true
      # Bundles weighed against one of a user's buckets. It also decides when a bucket's split
      # can be read as the whole of who drew on it: a split returned in full lets a bundle missing
      # from it report 0, while a truncated one falls back to the bucket's total across bundles.
      # BUCKET_INSTANCE.USAGE is what notices, since it asks once per bucket instance.
      services-per-user: 10
      nas-addresses-per-user: 5  # distinct NAS addresses weighed before NAS_IP_ADDRESS is picked
      # First spelling of the NAS field tried, not an assertion about the mapping: a terms
      # aggregation on a field that is not mapped returns no terms rather than an error, so the
      # dump asks the reported day's index which spelling it can aggregate before asking for the
      # addresses. If this one is not it, the same name with .keyword taken off is tried — the
      # address is a sub-field under a text mapping and a field of its own under a keyword or ip
      # one — and the log says which was taken. Override it only where cdr-service records the
      # address under some other name entirely.
      nas-ip-field: nasIpAddress.keyword
      # Fill NAS_IP_ADDRESS from the user's most recent session where the reported day's index
      # holds no session of theirs. cdr-service files a session document under the day the session
      # STARTED, so that index is not "the sessions of that day": a line that came up this morning
      # is in today's index, and one that came up last week and has not dropped since — an
      # always-on FTTH line — is in last week's. Neither is in D-1's, so the filter that keeps the
      # column the reported day's found nothing for them and the column came out empty beside a
      # UTLIZED_QUOTA reporting that same session's usage, which is summed over every index in the
      # scan. The reported day is still preferred, and the fallback is the newest index the user
      # appears in — where they were last anchored, not the NAS they used most across the years the
      # scan may cover. Each shard logs how many rows took it. Set false to report an empty column
      # for a user with no session document filed under the reported day, whatever the cluster
      # holds for them on either side of it.
      nas-ip-fallback-to-latest-day: true
      # sessionInstances is mapped as a nested type. False says it is not, and Elasticsearch then
      # flattens it: usage cannot be attributed to one bucket at all, so UTLIZED_QUOTA and
      # BUCKET_INSTANCE.USAGE both report the subscriber's whole CDR total — the extract against
      # the quota bucket alone. It is a degradation of both columns, not a switch: repairing the
      # mapping is what makes them per-bucket again.
      nested: true
      nested-table: true
      instances-path: sessionInstances

# Elasticsearch cluster holding the CDR session documents, read by the user data dump.
elasticsearch:
  host: elasticsearch.efk.svc.cluster.local
  port: 9200
  protocol: http
  username: "${ES_USER:}"
  password: "${ES_PASSWORD:}"
  pool:
    max-conn-total: 20
    max-conn-per-route: 20
    io-thread-count: 2
    connect-timeout-ms: 5000
    socket-timeout-ms: 120000
    connection-request-timeout-ms: 5000

redis:
  client-type: sentinel
  hosts: redis://redis-cluster.cluster-redis.svc.cluster.local:26379
  master-name: "${REDIS_MASTER_NAME}"
  role: "${REDIS_ROLE}"
  password: "${REDIS_PASSWORD}"
  max-pool-size: 300
  max-waiting-handlers: 5000
  max-pool-waiting: 800
  pool-recycle-timeout: 240000
  reconnect-attempts: 3
  reconnect-interval: 500
  pool-cleaner-interval: 20000
  timeout: 60000

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
      path-mapping:
        prometheus: prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

