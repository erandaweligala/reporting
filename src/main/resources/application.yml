server:
  port: 8082


base-url:
  context: /axonect/aee/templates/v1.0/base-template
  app:
    host: /MICROSERVICE_NAME/
    default:
      group-id: 1

    encryption:
      algorithm: "${ENCRYPTION_TYPE}"
      secret-key: "${ENCRYPTION_SECRET_KEY}"
    async:
      core-pool-size: 50
      max-pool-size: 200
      queue-capacity: 10000
      thread-name-prefix: "async-validation-"

log:
  identifierKey: UUID
  isDebug: true
info:
  app:
    name :  base-template
    msName : base-template
com:
  adl:
    dte:
      plugins:
        logging:
          enabled: true
          level: DEBUG
        rolling:
          policy: size
          size: 100000kb
        alarming:
          enabled: true
        msstat:
          enabled: true

springdoc:
  packagesToScan: com.axonect.aee.template.baseapp.application.controller
  pathsToMatch: /**
  swagger-ui:
    configUrl: /MICROSERVICE_NAME/v3/api-docs/swagger-config
    url: /MICROSERVICE_NAME/v3/api-docs
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs


spring:
  data:
    redis:
      sentinel:
        master: "${REDIS_MASTER_NAME}"
        nodes: redis-cluster.cluster-redis.svc.cluster.local:26379
      password: "${REDIS_PASSWORD}"
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 300
          max-idle: 50
          min-idle: 10
          max-wait: 800ms
  datasource:
    #    url: jdbc:oracle:thin:@aaa-dev.cn8eyeqma3tp.ap-southeast-2.rds.amazonaws.com:1521/ORCL
    #    username: aaa
    #    password: Aaa!89nky78D
        url: jdbc:oracle:thin:@localhost:1521/XEPDB1
        username: "${DB_USER}"
        password: "${DB_PASSWORD}"
        driver-class-name: oracle.jdbc.OracleDriver

        hikari:
          maximum-pool-size: 50
          minimum-idle: 30
          connection-timeout: 10000
          idle-timeout: 3000
          max-lifetime: 180000
          pool-name: AAAHikariPool
          leak-detection-threshold: 60000

          data-source-properties:
            oracle.net.CONNECT_TIMEOUT: 10000
            oracle.jdbc.ReadTimeout: 30000

        jpa:
          hibernate:
            ddl-auto: update
          show-sql: true
          properties:
            hibernate:
              format_sql: true
              dialect: org.hibernate.dialect.OracleDialect
              jdbc:
                batch_size: 20
                fetch_size: 1000
              order_inserts: true
              order_updates: true
              connection:
                pool_size: 200

  kafka:
    bootstrap-servers:
      dc: kafka-headless.cluster-dc.svc.cluster.local:9092
      dr: kafka-headless.cluster-dc.svc.cluster.local:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        max.in.flight.requests.per.connection: 5
        compression.type: lz4
        batch.size: 32768
        linger.ms: 5
        buffer.memory: 67108864
        delivery.timeout.ms: 8000
        request.timeout.ms: 5000
        max.block.ms: 5000

    consumer:
      group-id: spring-reply-group-reports   # UNIQUE
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: true
      properties:
        fetch.min.bytes: 1
        fetch.max.wait.ms: 500
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000


kafka:
  reply:
    topic: db-write-events-reply-reports
  publishing:
    topic: dc-provisioning
  group:
    id: spring-reply-group-reports   # UNIQUE



app:
  host: APP_BASE_PATH_PLACEHOLDER

logging:
  level:
    org.springframework.web: INFO

message-log:
  base-url: https://localhost:8089/api/logs/action-logs

session-history:
  base-url: http://localhost:9907/api/aaa/admin-console/connection-history/summary/filter

product-details:
  base-url: http://aeb53274042be477aba79f9076056316-ee9e05124271e8a5.elb.ap-southeast-2.amazonaws.com/airtel-aaa-product-catalog-management/api/plans/filter

subscriber-details:
  base-url: https://localhost:8089/api/user

audit-log:
  base-url: https://localhost:8089/api/user

csv:
  output:
    directory:  /reports/output

report:
  default:
    offset: 0
    limit: 5
  batch:
    size: 200
  output:
     directory: /reports/output
  watchdog:
    stale-threshold-minutes: 20
    check-interval-ms: 1200000   # 20 * 60 * 1000

  # MAC_SERVICE_TABLE, PLAN_TO_BUCKET and BUCKET_INSTANCE: whole-table extracts, as CSV.
  # One cursor and one sequential pass per extract; the knobs below are what bound its footprint.
  table-extract:
    jdbc-fetch-size: 5000        # rows Oracle ships per round trip
    query-timeout-seconds: 7200  # an extract that has gone wrong is cancelled, not left running
    csv-buffer-bytes: 1048576    # 1 MB in front of the output file
    # Oracle format model for every date column. The samples carried milliseconds; the operator
    # who opens an extract reads yyyy-MM-dd HH:mm:ss, and excel-safe-timestamps below normalises a
    # fraction away in any case, so the model no longer asks for one.
    date-format: "YYYY-MM-DD HH24:MI:SS"
    # Write the date columns as ="2026-08-18 14:31:23" rather than as bare text. Excel does not
    # read a CSV timestamp as a timestamp — it converts the text to the day number behind it and
    # shows that number (46271.07939), which is what the date columns of all three extracts were
    # reading. The ="..." form is a formula whose value is the string, so it is displayed exactly
    # as written. Set false for a consumer that loads an extract with something other than a
    # spreadsheet and wants the database's own text.
    excel-safe-timestamps: true

  # USER_DATA_DUMP: the full subscriber base (~3M rows) for the previous day, as CSV.
  user-dump:
    days-back: 1                 # 1 = D-1
    timezone: "${TZ:UTC}"        # must match the zone the CDR daily indices are named in
    shards: 4                    # username ranges scanned in parallel; 1 disables sharding
    worker-threads: 0            # 0 = one thread per shard
    jdbc-fetch-size: 5000        # rows Oracle ships per round trip
    query-timeout-seconds: 7200
    csv-buffer-bytes: 1048576    # 1 MB in front of the output file
    # Oracle format model for every timestamp column.
    date-format: "YYYY-MM-DD HH24:MI:SS"
    # Write the timestamp columns as ="2026-09-06 01:54:19" rather than as bare text. Excel does
    # not read a CSV timestamp as a timestamp — it converts the text to the day number behind it
    # and shows that number (46271.07939), which is what the date columns of the dump were
    # reading. The ="..." form is a formula whose value is the string, so it is displayed exactly
    # as written; the text is normalised to yyyy-MM-dd HH:mm:ss whatever date-format above says.
    # Set false for a consumer that reads the dump with something other than a spreadsheet.
    excel-safe-timestamps: true
    bandwidth-bucket-type: BANDWIDTH       # BUCKET_INSTANCE.BUCKET_TYPE holding PLAN_BANDWIDTH
    quota-bucket-type: DATA                # BUCKET_INSTANCE.BUCKET_TYPE holding QUOTA
    usage:
      enabled: true
      index: radius-sessions     # cdr-service `sessions-data`; the daily indices are derived from it
      page-size: 2000            # usernames per composite aggregation page
      # Days of CDR indices UTLIZED_QUOTA is summed over, ending at the reported day. 0 is every
      # index the cluster still holds, which is what a total means: the column is read next to
      # QUOTA, the bucket's whole allowance, so it has to be everything the bundle has drawn from
      # that bucket rather than the slice of it that fell on D-1. The days after the reported one
      # are struck out of the wildcard by name, so the index cdr-service is writing into is still
      # never read. A positive value names that many daily indices instead.
      lookback-days: 0
      buckets-per-user: 20
      # The CDR names the service instance each usage delta was drawn against, and a bucket id
      # names the plan's bucket rather than one instance of it — so without this scope a recurring
      # subscriber's every past cycle would be reported against the current cycle's QUOTA. Set it
      # false to report the bucket's total across every bundle that drew on it; the dump logs per
      # shard how many rows already had to fall back to that.
      scope-to-service: true
      services-per-user: 10      # bundles weighed against one of a user's buckets
      nas-addresses-per-user: 5  # distinct NAS addresses weighed before NAS_IP_ADDRESS is picked
      nas-ip-field: nasIpAddress.keyword
      nested: true               # sessionInstances is mapped as a nested type
      instances-path: sessionInstances

# Elasticsearch cluster holding the CDR session documents, read by the user data dump.
elasticsearch:
  host: elasticsearch.efk.svc.cluster.local
  port: 9200
  protocol: http
  username: "${ES_USER:}"
  password: "${ES_PASSWORD:}"
  pool:
    max-conn-total: 20
    max-conn-per-route: 20
    io-thread-count: 2
    connect-timeout-ms: 5000
    socket-timeout-ms: 120000
    connection-request-timeout-ms: 5000

redis:
  client-type: sentinel
  hosts: redis://redis-cluster.cluster-redis.svc.cluster.local:26379
  master-name: "${REDIS_MASTER_NAME}"
  role: "${REDIS_ROLE}"
  password: "${REDIS_PASSWORD}"
  max-pool-size: 300
  max-waiting-handlers: 5000
  max-pool-waiting: 800
  pool-recycle-timeout: 240000
  reconnect-attempts: 3
  reconnect-interval: 500
  pool-cleaner-interval: 20000
  timeout: 60000

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
      path-mapping:
        prometheus: prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

